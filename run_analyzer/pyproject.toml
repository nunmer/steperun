[project]
name = "steperun-run-analyzer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "numpy>=1.24.0",
    "mediapipe==0.10.33",
    # Headless OpenCV: the GUI build needs libGL, which Vercel doesn't have.
    "opencv-contrib-python-headless>=4.8,<5",
    "uvicorn[standard]>=0.27.0",
]

[tool.uv]
# mediapipe depends on the GUI opencv-contrib-python; both install the same
# cv2 package, so drop it in favour of the headless build above.
override-dependencies = ["opencv-contrib-python ; sys_platform == 'never'"]
