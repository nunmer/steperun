name: Deploy to Fly

on:
  push:
    branches: [main]
    # Only app changes redeploy; scraper/migration commits don't.
    paths:
      - "web/**"
      - "run_analyzer/**"
      - "Dockerfile"
      - ".dockerignore"
      - "fly.toml"
      - "start.sh"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Image is built on Fly's remote builder using fly.toml + Dockerfile.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
