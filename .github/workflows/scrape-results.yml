name: Scrape race results

on:
  schedule:
    # 03:00 UTC = 08:00 Almaty, daily
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      min_year:
        description: "Only scrape events from this year onward. Empty = last year onward. 0 = full history backfill."
        required: false
        default: ""
      athletex_backfill_from:
        description: "athletex.kz: also look for past seasons from this year (e.g. 2023). Empty = current listings only."
        required: false
        default: ""

concurrency:
  group: scrape-results
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Scrape new results
        id: scrape
        env:
          INPUT_MIN_YEAR: ${{ inputs.min_year }}
        run: |
          MIN_YEAR="${INPUT_MIN_YEAR:-}"
          if [ -z "$MIN_YEAR" ]; then
            MIN_YEAR=$(( $(date -u +%Y) - 1 ))
          fi
          if ! [[ "$MIN_YEAR" =~ ^[0-9]{1,4}$ ]]; then
            echo "::error::min_year must be a year or 0, got '$MIN_YEAR'"
            exit 1
          fi
          if [ "$MIN_YEAR" = "0" ]; then
            echo "Full history backfill"
            python scripts/scrape_almaty_marathon.py
          else
            echo "Scraping events from $MIN_YEAR onward"
            python scripts/scrape_almaty_marathon.py --min-year "$MIN_YEAR"
          fi

      - name: Import athletex.kz results
        id: athletex
        env:
          INPUT_BACKFILL_FROM: ${{ inputs.athletex_backfill_from }}
        run: |
          FROM="${INPUT_BACKFILL_FROM:-}"
          if [ -z "$FROM" ]; then
            python scripts/scrape_athletex.py
          elif [[ "$FROM" =~ ^20[0-9]{2}$ ]]; then
            python scripts/scrape_athletex.py --backfill --min-year "$FROM"
          else
            echo "::error::athletex_backfill_from must be a year like 2023, got '$FROM'"
            exit 1
          fi

      # Post-processing only when something new landed — keeps daily no-op
      # runs to a couple of reads, protecting the Supabase Disk IO budget.
      - name: Normalize event names
        if: steps.scrape.outputs.new_results != '0' || steps.athletex.outputs.new_results != '0'
        run: python scripts/fix_event_names.py

      - name: Hide relay teams / delete junk runners
        if: steps.scrape.outputs.new_results != '0' || steps.athletex.outputs.new_results != '0'
        run: python scripts/clean_runners.py

      - name: Fill missing event dates
        if: steps.scrape.outputs.new_results != '0' || steps.athletex.outputs.new_results != '0'
        run: python scripts/scrape_dates.py

      - name: Recalculate ELO (changed runners only)
        if: steps.scrape.outputs.new_results != '0' || steps.athletex.outputs.new_results != '0'
        run: python scripts/calculate_elo.py

      # Purge the site's cached race data so new results show up right away
      # (otherwise they appear within an hour).
      - name: Refresh site cache
        if: steps.scrape.outputs.new_results != '0' || steps.athletex.outputs.new_results != '0'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET not set; site cache refreshes within an hour"
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" https://www.steppe.run/api/revalidate

      - name: Summary
        if: always()
        env:
          NEW_RESULTS: ${{ steps.scrape.outputs.new_results || 'n/a' }}
          NEW_ATHLETEX: ${{ steps.athletex.outputs.new_results || 'n/a' }}
        run: |
          echo "almaty-marathon.kz new result rows: $NEW_RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo "athletex.kz new result rows: $NEW_ATHLETEX" >> "$GITHUB_STEP_SUMMARY"
